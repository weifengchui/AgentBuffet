[package]
name = "AgentBuffet"
version = "0.2.23"
edition = "2021"
license = "MIT"
description = "AgentBuffet（Agent食堂）—— 极低功耗 AI 模型 API 网关"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
bytes = "1"
futures-util = "0.3"
http = "1"
toml = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.2"
base64 = "0.22"

# Windows 专用：读取注册表枚举 WSL 发行版（纯 Rust，无 C 依赖）。
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[lib]
name = "agentbuffet"
path = "src/lib.rs"
