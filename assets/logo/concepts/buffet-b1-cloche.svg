<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentBuffet 餐盖长颈鹿">
  <defs>
    <linearGradient id="b1-bus" x1="14" y1="58" x2="46" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".55" stop-color="#5fc6ff"/>
      <stop offset="1" stop-color="#38e1c6"/>
    </linearGradient>
  </defs>
  <!-- 餐盘 + 餐盖：自助餐台 -->
  <g fill="none" stroke="url(#b1-bus)" stroke-linecap="round">
    <path d="M9 47.5H55" stroke-width="7"/>
    <path d="M14.5 44a17.5 17.5 0 0 1 35 0" stroke-width="6.4"/>
    <!-- 长颈鹿从餐盖里探出头：长颈 = AgentLink 血脉 -->
    <path d="M34.5 33c-2-8 1-14 6.5-17.5" stroke-width="6.6"/>
  </g>
  <ellipse cx="44.5" cy="12.4" rx="5.8" ry="4.6" transform="rotate(-14 44.5 12.4)" fill="#0a1220" stroke="#38e1c6" stroke-width="2.2"/>
  <g fill="#38e1c6">
    <circle cx="40.6" cy="6.4" r="1.9"/>
    <circle cx="47.4" cy="6" r="1.9"/>
  </g>
  <circle cx="43.2" cy="11.4" r="1.3" fill="#eafcff"/>
  <!-- 颈上节点：请求流经网关 -->
  <g fill="#eafcff" opacity=".92">
    <circle cx="34.4" cy="27.6" r="1.7"/>
    <circle cx="35.6" cy="21.8" r="1.7"/>
  </g>
  <!-- 优先级故障转移：三档供应商灯 -->
  <g>
    <circle cx="20.5" cy="38" r="2.1" fill="#4f8cff"/>
    <circle cx="32" cy="34.5" r="2.1" fill="#5fc6ff"/>
    <circle cx="43.5" cy="38" r="2.1" fill="#a78bfa"/>
  </g>
</svg>
