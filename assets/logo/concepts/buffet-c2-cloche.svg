<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentBuffet 餐盖长颈鹿 C2">
  <defs>
    <linearGradient id="c2-bus" x1="14" y1="58" x2="48" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".5" stop-color="#38e1c6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#c2-bus)" stroke-linecap="round">
    <!-- 长颈鹿从餐盖里探出头：颈 = 请求穿过网关 -->
    <path d="M32 31c-1.6-8 .8-14 6.4-17.4" stroke-width="6"/>
    <!-- 餐盖：与餐盘留 4px 缝，读得出「盖」 -->
    <path d="M16.5 46a15.5 15.5 0 0 1 31 0" stroke-width="5.6"/>
    <!-- 餐盘 -->
    <path d="M8.5 51h47" stroke-width="6.4"/>
  </g>
  <ellipse cx="41.5" cy="10.6" rx="5.6" ry="4.4" transform="rotate(-14 41.5 10.6)" fill="#0a1220" stroke="#38e1c6" stroke-width="2.4"/>
  <g fill="#38e1c6">
    <circle cx="37.4" cy="4.4" r="1.9"/>
    <circle cx="44.4" cy="4.2" r="1.9"/>
  </g>
  <circle cx="40.2" cy="9.6" r="1.4" fill="#eafcff"/>
  <circle cx="32.3" cy="24.5" r="1.8" fill="#eafcff" opacity=".9"/>
  <!-- 盖上的供应商档位灯 -->
  <circle cx="23" cy="40.5" r="2.2" fill="#4f8cff"/>
  <circle cx="41.2" cy="40.5" r="2.2" fill="#a78bfa"/>
</svg>
