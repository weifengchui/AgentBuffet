    <circle cx="45" cy="4.2" r="2"/>
  </g>
  <circle cx="40.4" cy="10" r="1.5" fill="#eafcff"/>
  <circle cx="32.6" cy="24" r="1.9" fill="#eafcff" opacity=".9"/>
