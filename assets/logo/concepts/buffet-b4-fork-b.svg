<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentBuffet 餐叉字母 B">
  <defs>
    <linearGradient id="b4-bus" x1="14" y1="56" x2="50" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".5" stop-color="#38e1c6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#b4-bus)" stroke-linecap="round">
    <!-- 餐叉柄 = B 的竖笔 -->
    <path d="M22 18v30" stroke-width="6"/>
    <!-- 叉齿 -->
    <path d="M14 10v6M22 8.5v7M30 10v6" stroke-width="3.2" opacity=".9"/>
    <!-- 两个餐盘 = B 的两只碗 -->
    <path d="M22 18h10a8 8 0 0 1 0 15H22" stroke-width="5.4"/>
    <path d="M22 33h12a8.5 8.5 0 0 1 0 15H22" stroke-width="5.4"/>
  </g>
  <!-- 供应商档位：优先级故障转移 -->
  <g>
    <circle cx="48" cy="24" r="2.4" fill="#4f8cff"/>
    <circle cx="52" cy="33" r="2.4" fill="#38e1c6"/>
    <circle cx="48" cy="42" r="2.4" fill="#a78bfa"/>
  </g>
</svg>
