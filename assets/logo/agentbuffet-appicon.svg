    </g>
    <circle cx="32" cy="32" r="27" fill="none" stroke="#1b3a6b" stroke-width="1" opacity=".7"/>
    <g transform="translate(32 32) scale(.78) translate(-32 -32)" filter="url(#bfli-glow)">
