<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentBuffet app icon">
  <title>AgentBuffet · 应用图标（圆角方底 + 星点 + 发光长颈鹿与餐盖）</title>
  <defs>
    <radialGradient id="bfli-bg" cx=".3" cy=".18" r="1.05">
      <stop offset="0" stop-color="#13233f"/>
      <stop offset=".55" stop-color="#0a1224"/>
      <stop offset="1" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="bfli-bus" x1="16" y1="56" x2="44" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".55" stop-color="#63d2ff"/>
      <stop offset="1" stop-color="#38e1c6"/>
    </linearGradient>
    <linearGradient id="bfli-dish" x1="32" y1="56" x2="58" y2="32" gradientUnits="userSpaceOnUse">
