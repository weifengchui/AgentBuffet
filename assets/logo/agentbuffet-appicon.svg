    <filter id="bfli-glow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="bfli-clip"><rect width="64" height="64" rx="14.5"/></clipPath>
  </defs>
  <g clip-path="url(#bfli-clip)">
