<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentBuffet Console</title>
<style>
:root {
  --bg: #0b0e14; --side: #0e1219; --card: #10151d; --card2: #131a24;
  --line: #1c2330; --text: #dbe2ea; --dim: #7d8aa0; --dim2: #9aa7b8;
  --accent: #4f8cff; --accent2: #7fb0ff; --active: #16233b;
  --on: #3fb950; --off: #f85149; --warn: #d29922;
  --chip: #182238; --chip-t: #9db4dd;
}
* { box-sizing: border-box; }
/* 滚动条：纤细圆角、透明轨道，悬停/拖动渐亮，贴合深色主题 */
* { scrollbar-width: thin; scrollbar-color: #2b3648 transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: #2b3648; border: 2px solid transparent;
  border-radius: 999px; background-clip: padding-box; min-height: 28px; min-width: 28px; }
::-webkit-scrollbar-thumb:hover { background: #3d4c66; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:active { background: var(--accent); border: 2px solid transparent; background-clip: padding-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
.app { display: flex; min-height: 100vh; }

/* ---------------- sidebar ---------------- */
aside { width: 216px; flex: 0 0 auto; background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; transition: width .18s; }
.logo { display: flex; align-items: center; gap: 9px; padding: 18px 16px 14px; white-space: nowrap; overflow: hidden; }
.logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 10px var(--accent); flex: 0 0 auto; }
.logo .word { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: .2px; }
.logo .ver { font-size: 10px; color: var(--accent2); background: var(--chip); border: 1px solid #223052;
  border-radius: 999px; padding: 1px 7px; }
nav { display: flex; flex-direction: column; gap: 3px; padding: 6px 10px; flex: 1; }
nav button { display: flex; align-items: center; gap: 10px; background: none; border: none;
  color: var(--dim); padding: 9px 12px; border-radius: 8px; cursor: pointer; font: inherit;
  text-align: left; white-space: nowrap; overflow: hidden; }
nav button:hover { color: var(--text); background: #121826; }
nav button.on { color: var(--accent2); background: var(--active); }
nav button svg { width: 16px; height: 16px; flex: 0 0 auto; }
.side-foot { padding: 12px 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
.side-foot button { flex: 1; background: none; border: 1px solid var(--line); color: var(--dim);
  padding: 6px 0; border-radius: 8px; cursor: pointer; font: inherit; }
.side-foot button:hover { color: var(--text); border-color: #2a3548; }
body.sb-collapsed aside { width: 62px; }
body.sb-collapsed .logo { justify-content: center; padding-left: 0; padding-right: 0; }
body.sb-collapsed .logo .word, body.sb-collapsed .logo .ver { display: none; }
body.sb-collapsed nav button { justify-content: center; padding: 9px 0; }
body.sb-collapsed nav button span { display: none; }
body.sb-collapsed .side-foot { justify-content: center; }
body.sb-collapsed #lang-btn { display: none; }

/* ---------------- topbar / main ---------------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
  padding: 12px 24px; background: rgba(11,14,20,.78); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
header.top h2 { margin: 0; font-size: 15px; font-weight: 600; }
.tb-hd { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
#tb-hint { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-actions { display: flex; gap: 8px; align-items: center; }
.pills { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
#content { padding: 22px 24px 60px; max-width: 1240px; width: 100%; margin: 0 auto; }
.view { display: none; } .view.on { display: block; }

/* ---------------- primitives ---------------- */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 16px; }
.panel > h3 { margin: 0 0 4px; font-size: 14px; color: var(--text); }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.muted { color: var(--dim); font-size: 12px; }
.ftag { display: inline-block; background: #0f2c1c; color: #3fd0a0; border: 1px solid #1d4d33; border-radius: 6px; font-size: 10px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; line-height: 16px; }
.btn { background: var(--active); border: 1px solid #27406b; color: var(--accent2);
  padding: 6px 13px; border-radius: 8px; cursor: pointer; font: inherit; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: #a8c8ff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
.btn.primary:hover { background: #6ba1ff; color: #06101f; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--dim2); }
.btn.ghost:hover { color: var(--text); border-color: #2a3548; }
.btn.danger { background: #1a1215; border-color: #3a2026; color: var(--off); }
.btn.danger:hover { border-color: var(--off); color: #ff8880; }
.btn.sm { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
.chip { display: inline-block; background: var(--chip); color: var(--chip-t); border-radius: 6px;
  padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
  padding: 2px 10px; font-size: 12px; border: 1px solid; white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }
.pill.on { color: var(--on); border-color: #274a30; background: #101d14; }
.pill.off { color: var(--off); border-color: #4a2726; background: #1d1010; }
.pill.warn { color: var(--warn); border-color: #4a3d1e; background: #1d1810; }
.pill.dim { color: var(--dim); border-color: var(--line); background: #10151d; }
.bar { background: #0c1015; border-radius: 3px; height: 6px; overflow: hidden; flex: 1; min-width: 60px; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.bar i.hot { background: var(--warn); } .bar i.full { background: var(--off); }
table { width: 100%; border-collapse: collapse; }
th { color: var(--dim); font-weight: 500; font-size: 12px; text-align: left;
  padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid #161d29; font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--card2); }
pre { background: #0c1015; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  overflow-x: auto; font: 12px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace; color: #b8c4d4;
  margin: 8px 0; }
code { font: 12px ui-monospace, Consolas, monospace; color: var(--chip-t); }
input[type=text], input[type=password], input[type=number], select, textarea {
  background: #0d1320; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 10px; font: inherit; outline: none; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
  linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
  background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
label.f { display: block; margin-bottom: 12px; }
label.f > span { display: block; color: var(--dim2); font-size: 12px; margin-bottom: 4px; }
label.ck { display: flex; align-items: center; gap: 8px; color: var(--dim2); cursor: pointer; margin-bottom: 10px; }
label.ck input { width: auto; accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.empty { border: 1px dashed #2a3548; border-radius: 12px; padding: 42px 20px; text-align: center;
  color: var(--dim); background: #0d1219; }
.empty .big { font-size: 26px; margin-bottom: 8px; }
.empty b { color: var(--dim2); font-weight: 500; display: block; margin-bottom: 4px; }

/* ---------------- cards ---------------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat .k { color: var(--dim); font-size: 12px; }
.stat .v { font-size: 22px; font-weight: 600; margin-top: 4px; color: var(--text); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 9px; }
.pcard:hover { border-color: #2a3548; }
.pc-top { display: flex; align-items: center; gap: 8px; }
.pc-id { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-all; }
.quota { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.pc-ops { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.gcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 14px; }
.g-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.g-top b { font-size: 14px; }
.g-ops { margin-left: auto; display: flex; gap: 6px; }

/* ---------------- modal / toast ---------------- */
#modal-mask { display: none; position: fixed; inset: 0; background: rgba(4,7,12,.62);
  backdrop-filter: blur(3px); z-index: 100; align-items: flex-start; justify-content: center;
  overflow-y: auto; padding: 7vh 16px 16px; }
#modal-mask.on { display: flex; }
#modal-box { background: var(--card); border: 1px solid #263041; border-radius: 14px;
  width: 600px; max-width: 94vw; box-shadow: 0 18px 50px rgba(0,0,0,.55); animation: pop .16s ease-out; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
#modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
#modal-head b { font-size: 14px; }
#modal-x { margin-left: auto; background: none; border: none; color: var(--dim); font-size: 18px;
  cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 6px; }
#modal-x:hover { color: var(--text); background: var(--card2); }
#modal-body { padding: 16px 18px; max-height: 66vh; overflow-y: auto; }
#modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
#toasts { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); z-index: 200;
  display: flex; flex-direction: column; gap: 8px; align-items: center; max-width: min(92vw, 620px); }
.toast { background: var(--card); border: 1px solid #263041; border-left-width: 3px; border-radius: 10px;
  padding: 10px 14px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
  animation: slidein .18s ease-out; word-break: break-all; }
.toast.ok { border-left-color: var(--on); }
.toast.bad { border-left-color: var(--off); }
.toast.warn { border-left-color: var(--warn); }
.toast.info { border-left-color: var(--accent); }
@keyframes slidein { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
details.adv { border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 16px; }
details.adv > summary { cursor: pointer; padding: 13px 18px; color: var(--dim2); font-weight: 500; }
details.adv > summary:hover { color: var(--text); }
details.adv .adv-body { padding: 0 18px 16px; }
.mrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.mrow select, .mrow input { width: auto; }
.mrow .mp { flex: 1 1 34%; } .mrow .mm { flex: 1 1 40%; }
.mrow .btn.ghost { flex: 0 0 auto; }
.mrow .grip { cursor: grab; color: var(--dim); user-select: none; font-size: 14px; flex: 0 0 auto; }
.mrow.dragover { outline: 1px dashed #4f8cff; outline-offset: 2px; border-radius: 8px; }
/* 可搜索下拉（模型列表）：输入框只管过滤，浮层固定定位以免被模态框滚动区裁切 */
.cb { position: relative; display: block; flex: 1 1 40%; min-width: 0; }
.cb input { width: 100%; padding-right: 24px; }
.cb > .cb-ar { position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  color: var(--dim); font-size: 9px; pointer-events: none; }
.cb-pop { position: fixed; z-index: 300; display: none; background: var(--card);
  border: 1px solid #263041; border-radius: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.55);
  overflow-y: auto; padding: 4px 0; }
.cb-pop.on { display: block; }
.cb-opt { padding: 7px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; color: var(--dim2); }
.cb-opt.sel { color: var(--accent2); }
.cb-opt.hl { background: var(--active); color: var(--text); }
.cb-empty { padding: 9px 12px; font-size: 12px; color: var(--dim); }
/* ---------------- agents 接入器：双栏（左按环境分组实例列表 / 右详情与路由配置） ---------------- */
.ag-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
.ag-left { padding: 14px 10px 10px; }
.ag-seg { color: var(--dim); font-size: 11px; font-weight: 600; letter-spacing: .5px;
  text-transform: uppercase; padding: 10px 8px 4px; }
.ag-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px;
  cursor: pointer; border: 1px solid transparent; }
.ag-item:hover { background: var(--card2); }
.ag-item.on { background: var(--active); border-color: #27406b; }
.ag-item .nm { font-weight: 600; font-size: 13px; color: var(--text); }
.ag-item .sub { font-size: 11px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
.ag-dhd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.ag-dhd b { font-size: 15px; }
.ag-dhd .chip.on { border-color: #2b4a76; }
.ag-path { display: flex; gap: 8px; align-items: center; font: 11px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  color: var(--dim2); word-break: break-all; background: #0c1015; border: 1px solid var(--line);
  border-radius: 7px; padding: 6px 9px; cursor: pointer; }
.ag-path:hover { color: var(--text); border-color: #2a3548; }
.ag-warn { border: 1px solid #4a3d1e; background: #1d1810; color: var(--warn); border-radius: 8px;
  padding: 8px 12px; font-size: 12px; margin: 10px 0; line-height: 1.6; }
/* 接入器：使用模型按故障转移次序自上而下排列，序号即先后 */
.ag-mlist { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
.ag-mlist .ag-mrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim2);
  background: #0c1015; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
.ag-mlist .ag-mrow:first-child { border-color: #2b4a76; }
.ag-mlist .ag-mrow code { font-family: ui-monospace, Consolas, monospace; color: var(--text);
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-mlist .ftag { flex: 0 0 auto; white-space: nowrap; }
.ag-mlist .ag-mord { flex: 0 0 auto; min-width: 16px; height: 16px; border-radius: 50%; background: var(--active);
  color: var(--dim2); font-size: 10.5px; display: inline-flex; align-items: center; justify-content: center; }
.ag-mlist .ag-mrow:first-child .ag-mord { color: var(--text); }
@media (max-width: 980px) { .ag-layout { grid-template-columns: 1fr; } }
.gcard .grip { cursor: grab; color: var(--dim); user-select: none; font-size: 14px; flex: 0 0 auto; }
#gl-tip { position: fixed; z-index: 99999; display: none; pointer-events: none; background: #1f2b45; color: var(--fg); border: 1px solid #354564; padding: 5px 10px; border-radius: 7px; font-size: 12px; line-height: 1.5; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.fc { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--dim2); }
.fc i { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.gcard tbody tr.dragover td { background: rgba(79,140,255,.14); }
.gcard td.ord { cursor: grab; color: var(--dim); white-space: nowrap; user-select: none; }
.gcard td.ord:active { cursor: grabbing; }
.gcard.dragover { outline: 1px dashed #4f8cff; outline-offset: 2px; }
hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
/* ---------------- starmap ---------------- */
#ov-map { position: relative; height: 340px; border: 1px solid var(--line); border-radius: 10px; margin-top: 10px;
  overflow: hidden; background:
  radial-gradient(560px 300px at 50% 46%, rgba(79,140,255,.07), transparent 70%),
  linear-gradient(rgba(108,168,255,.04) 1px, transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg, rgba(108,168,255,.04) 1px, transparent 1px) 0 0/40px 40px, #0a0f18; }
#ov-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#ov-stars { position: absolute; inset: 0; pointer-events: none; }
#ov-stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #cfe3ff;
  opacity: .05; animation: twk 3s ease-in-out infinite alternate; }
@keyframes twk { from { opacity: .03; } to { opacity: .25; } }
#ov-recent-wrap { max-height: 440px; overflow: auto; margin-top: 8px; }
#ov-recent-wrap thead th { position: sticky; top: 0; z-index: 2; background: var(--card); }
#ov-map .lk { fill: none; stroke-width: 1.4; opacity: .16; transition: opacity .35s ease; }
#ov-map .lk.live { opacity: .8; stroke-width: 2.1; filter: drop-shadow(0 0 4px rgba(160,210,255,.5)); }
#ov-map .mlab { fill: #9aa7b8; font-size: 11px; text-anchor: middle; }
.lgd { display: inline-flex; align-items: center; gap: 5px; }
.lgd i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } aside { width: 62px; }
  body:not(.sb-collapsed) aside { width: 216px; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><span class="dot"></span><span class="word">AgentBuffet</span><span class="ver">v__BUFFET_VERSION__</span></div>
    <nav id="nav">
      <button data-v="overview" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span data-i18n="nav.overview"></span></button>
      <button data-v="providers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18a4 4 0 1 1 .6-7.96A6 6 0 0 1 18 9.5 4.2 4.2 0 0 1 17.5 18Z"/></svg><span data-i18n="nav.providers"></span></button>
      <button data-v="routing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 6H12a3 3 0 0 1 3 3v.5M8.5 18H12a3 3 0 0 0 3-3v-.5"/></svg><span data-i18n="nav.routing"></span></button>
      <button data-v="agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7V4m6 3V4M8 10h8a2 2 0 0 1 2 2v3a5 5 0 0 1-10 0v-3a2 2 0 0 1 2-2Z"/></svg><span data-i18n="nav.agents"></span></button>
      <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1m0-14.2-2.1 2.1m-10 10-2.1 2.1"/></svg><span data-i18n="nav.settings"></span></button>
    </nav>
    <div class="side-foot">
      <button id="collapse-btn" title="⇧"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button id="lang-btn">EN</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="tb-hd"><h2 id="tb-title"></h2><span id="tb-hint" class="muted"></span></div>
      <div class="pills" id="tb-pills"></div>
      <div class="tb-actions" id="tb-actions"></div>
    </header>
    <main id="content">

      <section id="v-overview" class="view on">
        <div class="cards">
          <div class="stat"><div class="k" data-i18n="ov.req"></div><div class="v" id="ov-req">-</div></div>
          <div class="stat"><div class="k" data-i18n="ov.pt"></div><div class="v" id="ov-pt">-</div></div>

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = Array.isArray(j.details) ? j.details.join("; ") : "";
    throw new Error((j.error || "HTTP " + r.status) + (d ? ": " + d : ""));
  }
  return j;
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
});
let glTip = null;
document.addEventListener("mousemove", (e) => {
  if (e.target.closest && e.target.closest("#nav") && !document.body.classList.contains("sb-collapsed")) {
    if (glTip) glTip.style.display = "none"; return;
  }
  let txt = null;
  for (let n = e.target; n && n !== document.documentElement; n = n.parentElement || n.parentNode) {
    if (n.nodeType !== 1) continue;
    if (n.dataset && n.dataset.tip) { txt = n.dataset.tip; break; }
    const t = n.getAttribute && n.getAttribute("title");
    if (t) { n.setAttribute("data-tip", t); n.removeAttribute("title"); txt = t; break; }
    if (n.namespaceURI === "http://www.w3.org/2000/svg") {
      const ch = Array.from(n.children).find(c => c.localName === "title");
      if (ch && ch.textContent) { n.dataset.tip = ch.textContent; ch.remove(); txt = n.dataset.tip; break; }
    }
  }
  if (!txt) { if (glTip) glTip.style.display = "none"; return; }
  if (!glTip) { glTip = document.createElement("div"); glTip.id = "gl-tip"; document.body.appendChild(glTip); }
  glTip.textContent = txt;
  glTip.style.display = "block";
  const w = glTip.offsetWidth, h = glTip.offsetHeight, pad = 12;
  let x = Math.min(Math.max(e.clientX, w / 2 + 6), innerWidth - w / 2 - 6);
  let y = e.clientY - pad - h;
  if (y < 4) y = e.clientY + pad;
  glTip.style.left = (x - w / 2) + "px";
  glTip.style.top = y + "px";
}, true);
document.addEventListener("mouseleave", () => { if (glTip) glTip.style.display = "none"; });

async function doRefresh(btn, name) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "\u21bb " + L("刷新中", "Refreshing");
  try {
    const ok = await window[name]();
    if (ok !== false) toast(L("已刷新", "Refreshed"), "ok");
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

function toast(msg, type = "info") {
  const d = document.createElement("div");
  d.className = "toast " + type;
  d.textContent = msg;
  $("toasts").appendChild(d);
  setTimeout(() => { d.style.opacity = "0"; d.style.transition = "opacity .3s"; }, 3500);
  setTimeout(() => d.remove(), 3900);
}

      const c = { ok: "#3fb950", degraded: "#f85149", circuit_open: "#d29922", quota_exhausted: "#d29922" }[st] || "#50607a";
      return `<span class="fc" title="${esc(st ? stLabel(st) : "-")}"><i style="background:${c}"></i>${esc(p)}</span>`; }).join('<span class="muted">→</span>') || `<span class="muted">-</span>`}</td>
  </tr>`).join("")
    || `<tr><td colspan="10"><div class="empty"><div class="big">☕</div><b>${esc(L("今天还没有请求", "No requests yet today"))}</b>${esc(L("接入你的编程 Agent 后，流量统计会实时出现在这里", "Traffic will appear here once your coding agents go through the gateway"))}</div></td></tr>`;

async function loadOverview() {
  try {
    const j = await api("/api/overview");
    renderOverview(j);

  } catch (err) { toast(err.message, "bad"); return false; }

// ---------------- starmap ----------------
const PCOL = { ok: "#3fb950", degraded: "#f85149", circuit_open: "#d29922", quota_exhausted: "#d29922", disabled: "#50607a" };
let mapTimer = null, mapFired = new Set(), mapLive = {}, mapNodes = null, mapStars = false;
const photons = []; let phRaf = null;
const hashK = (s) => { let h = 17; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 2654435761); return Math.abs(h); };
const PAL = ["#38d6e6", "#c77dff", "#43d97b", "#ffb347", "#7fb0ff", "#ff5c7a", "#3fd0a0", "#f97fd0", "#9d7bff", "#5cc8ff"];
const palOf = (s) => PAL[hashK(String(s)) % PAL.length];
const ctrl = (p1, p2, k) => { const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2, dx = p2.x - p1.x, dy = p2.y - p1.y, L = Math.hypot(dx, dy) || 1, bow = 24 + (hashK(k) % 20); return { x: mx + (-dy / L) * bow, y: my + (dx / L) * bow }; };
const chanD = (p1, c, p2) => `M ${p1.x} ${p1.y} Q ${c.x} ${c.y} ${p2.x} ${p2.y}`;
const qp = (p1, c, p2, u) => { const it = 1 - u; return { x: it * it * p1.x + 2 * it * u * c.x + u * u * p2.x, y: it * it * p1.y + 2 * it * u * c.y + u * u * p2.y }; };
function startMap() { stopMap(); loadMap(); mapTimer = setInterval(loadMap, 3000); }
function stopMap() { if (mapTimer) { clearInterval(mapTimer); mapTimer = null; } }
async function loadMap() {
  if (document.hidden) return;
  try {
    const [agents, routing, providers, ov] = await Promise.all([
      api("/api/agents"), api("/api/routing"), api("/api/providers"), api("/api/overview"),
    ]);
    renderOverview(ov);
    drawMap(agents.filter(a => a.attached), routing.groups || [], providers, ov.recent || []);
  } catch (e) { /* 星图不可用时静默 */ }
}
function drawMap(agents, groups, providers, recent) {
  const svg = $("ov-svg"); if (!svg) return;
  if (!mapStars) { mapStars = true; let st = ""; for (let i = 0; i < 46; i++) st += `<i style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;animation-duration:${(2+Math.random()*3).toFixed(2)}s;animation-delay:${(Math.random()*3).toFixed(2)}s"></i>`; $("ov-stars").innerHTML = st; }
  const W = 1000, H = 340, cx = W / 2, cy = H / 2;
  const pvIds = [...new Set(groups.flatMap(g => g.members.map(m => m.provider)))];
  const pvs = pvIds.map(id => providers.find(x => x.id === id) || { id, status: "disabled" });
  const allocCol = (ids) => { const m = {}, used = new Set();
    for (const id of [...new Set(ids)].sort()) {
      let i = hashK(String(id)) % PAL.length, j = 0;
      while (used.has(PAL[i]) && j < PAL.length) { i = (i + 1) % PAL.length; j++; }
      used.add(PAL[i]); m[id] = PAL[i]; }
    return m; };
  const acol = allocCol(agents.map(a => a.agent_id)), pcol = allocCol(pvs.map(x => x.id));
  const pos = { gw: { x: cx, y: cy } };
  const yAt = (i, n) => n === 1 ? cy : 46 + (H - 92) * i / (n - 1);
  agents.forEach((a, i) => pos["ag:" + a.agent_id] = { x: 132, y: yAt(i, agents.length) });
  pvs.forEach((x, i) => pos["pv:" + x.id] = { x: W - 132, y: yAt(i, pvs.length) });
  mapNodes = pos;
  const now = Date.now() / 1000;
  for (const k in mapLive) if (mapLive[k] < now) delete mapLive[k];
  let h = "";
  const link = (k1, k2, col) => { const p1 = pos[k1], p2 = pos[k2], key = k1 + "=>" + k2;
    return `<path class="lk${mapLive[key] ? " live" : ""}" data-k="${key}" d="${chanD(p1, ctrl(p1, p2, key), p2)}" stroke="${col}"/>`; };
  for (const a of agents) h += link("ag:" + a.agent_id, "gw", acol[a.agent_id]);
  for (const x of pvs) h += link("gw", "pv:" + x.id, pcol[x.id]);
  h += `<g><circle cx="${cx}" cy="${cy}" r="30" fill="rgba(79,140,255,.08)" stroke="rgba(127,176,255,.35)"/>
    <circle cx="${cx}" cy="${cy}" r="18" fill="#101a2e" stroke="#7fb0ff" stroke-width="1.5"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#4f8cff"><animate attributeName="opacity" values="1;.35;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <text class="mlab" x="${cx}" y="${cy+48}">Gateway</text></g>`;
  for (const a of agents) {
    const p = pos["ag:" + a.agent_id], col = acol[a.agent_id];
    const nm = a.agent_id.length > 11 ? a.agent_id.slice(0, 10) + "…" : a.agent_id;
    h += `<g><rect x="${p.x-54}" y="${p.y-13}" width="108" height="26" rx="13" fill="#13233a" stroke="${col}" stroke-width="1.2"${a.drifted ? ' stroke-dasharray="4 3"' : ""}/>
      <text x="${p.x}" y="${p.y+4}" text-anchor="middle" fill="#dcecf8" font-size="11.5">${esc(nm)}</text>
      <title>${esc(a.agent_id)} · ${esc(a.default_group || "-")}${a.other_gateway ? " · " + esc(L("被他网关占用", "other gateway")) : a.drifted ? " · " + esc(L("漂移", "drifted")) : ""}</title></g>`;
  }
  for (const q of pvs) {
    const p = pos["pv:" + q.id], col = pcol[q.id], scol = PCOL[q.status] || "#50607a";
    const nm = q.id.length > 12 ? q.id.slice(0, 11) + "…" : q.id;
    h += `<g><circle cx="${p.x}" cy="${p.y}" r="12" fill="#0d1522" stroke="${col}" stroke-width="1.6"/>
      <circle cx="${p.x}" cy="${p.y}" r="4" fill="${scol}"/>
      <text class="mlab" x="${p.x}" y="${p.y+28}">${esc(nm)}</text>
      <title>${esc(q.id)} · ${esc(stLabel(q.status))}</title></g>`;
  }
  if (!agents.length) h += `<text class="mlab" x="${cx}" y="40" fill="#6b7d94">${esc(L("暂无在线 Agent：到「接入器」接入后，链路将实时点亮", "No online agents yet — attach one under Agents to light up the map"))}</text>`;
  h += `<g id="ph"></g>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = h;
  const ph = $("ph"); for (const e of photons) ph.appendChild(e.el);
  $("ov-map-lg").innerHTML = `<span class="lgd">${esc(L("节点颜色区分身份；服务商内芯色表示状态：", "Node colors identify nodes; provider core colors show status:"))}</span>` +
    [["#3fb950", L("正常", "ok")], ["#d29922", L("熔断 / 额度", "circuit / quota")], ["#f85149", L("降级", "degraded")], ["#50607a", L("停用", "disabled")]]
    .map(([c, t2]) => `<span class="lgd"><i style="background:${c}"></i>${esc(t2)}</span>`).join("");
  for (const e of recent) {
    const key = `${e.ts}|${e.agent}|${e.provider}|${e.model}`;
    if (mapFired.has(key)) continue;
    mapFired.add(key);
    if (now - e.ts > 60 || now - e.ts < -2) continue;
    const k1 = "ag:" + e.agent, k2 = "pv:" + e.provider;
    if (!pos[k1] || !pos[k2]) continue;
    const lk1 = k1 + "=>gw", lk2 = "gw=>" + k2;
    mapLive[lk1] = now + 60; mapLive[lk2] = now + 60;
    for (const k of [lk1, lk2]) { const el = svg.querySelector(`[data-k="${CSS.escape(k)}"]`); if (el) el.classList.add("live"); }
    spawnPhoton(pos[k1], pos[k2], acol[e.agent] || palOf(e.agent), pcol[e.provider] || palOf(e.provider), e.status < 400 ? null : "#f85149", lk1, lk2);
  }
  if (mapFired.size > 500) mapFired.clear();
}
function spawnPhoton(a, b, col1, col2, bad, k1, k2) {
  const ph = $("ph"), g = mapNodes && mapNodes.gw; if (!ph || !g) return;
  const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  el.setAttribute("r", "3.5"); el.setAttribute("fill", "#fff");
  const glow = (c) => `drop-shadow(0 0 5px ${c}) drop-shadow(0 0 11px ${c})`;
  el.style.filter = glow(bad || col1);
  ph.appendChild(el);
  photons.push({ el, glow, a, g, b, c1: ctrl(a, g, k1), c2: ctrl(g, b, k2), t0: performance.now(), dur: 1600, col1, col2, bad, seg: 0 });
  if (!phRaf) phTick();
}
function phTick() {
  const t = performance.now();
  for (let i = photons.length - 1; i >= 0; i--) {
    const p = photons[i], u = (t - p.t0) / p.dur;
    if (u >= 1) { p.el.remove(); photons.splice(i, 1); continue; }
    const seg = u < 0.5 ? 0 : 1;
    if (p.seg !== seg) { p.seg = seg; p.el.style.filter = p.glow(p.bad || (seg ? p.col2 : p.col1)); }
    const pt = u < 0.5 ? qp(p.a, p.c1, p.g, u * 2) : qp(p.g, p.c2, p.b, (u - 0.5) * 2);
    p.el.setAttribute("cx", pt.x); p.el.setAttribute("cy", pt.y);
  }
  phRaf = photons.length ? requestAnimationFrame(phTick) : null;
}

<script>
"use strict";
// ---------------- providers ----------------
const STP = { ok: "on", disabled: "dim", degraded: "off", circuit_open: "warn", quota_exhausted: "warn" };
const stLabel = (s) => ({
  ok: L("正常", "healthy"), disabled: L("已停用", "disabled"), degraded: L("降级", "degraded"),
  circuit_open: L("熔断中", "circuit open"), quota_exhausted: L("额度用尽", "quota exhausted"),

          <button class="btn sm ghost" onclick="openKeys('${esc(p.id)}')">${esc(L("密钥", "Keys"))}</button>
          <button class="btn sm ghost" onclick="fetchModels('${esc(p.id)}',this)">${esc(L("拉取模型", "Fetch models"))}</button>

          <button class="btn sm ghost" onclick="toggleDisabled('${esc(p.id)}')">${p.disabled || p.status === "disabled" ? esc(L("启用", "Enable")) : esc(L("停用", "Disable"))}</button>

        </div></div>`;
    }).join("") || `<div class="empty" style="grid-column:1/-1"><div class="big">🛒</div><b>${esc(L("还没有服务商", "No providers yet"))}</b>${esc(L("点右上角「添加服务商」，选厂商 → 选套餐 → 贴 Key，三步完成", "Click “Add provider”: pick vendor → pick plan → paste key. Three steps."))}</div>`;

}

async function openKeys(id) {

    ${hints.length ? hints.map((h, i) => `<div class="mrow"><span class="chip">#${i + 1}</span><code>${esc(h)}</code>
      <button class="btn sm danger" style="margin-left:auto" onclick="removeKey('${esc(id)}',${i})">✕ ${esc(L("删除", "Remove"))}</button></div>`).join("")

<script>
"use strict";
// ---------------- routing ----------------
async function loadRouting() {
  try {
    const j = await api("/api/routing");
    state.groups = j.groups || [];
    if (!state.providers.length) state.providers = await api("/api/providers");
    $("rt-grid").innerHTML = state.groups.map((g, i) => `

          <span class="muted">${g.members.length} ${esc(L("个成员", "members"))}</span>

            <button class="btn sm ghost" onclick="openGroup('${esc(g.name)}')">${esc(L("编辑", "Edit"))}</button>

        <table><thead><tr><th>#</th><th data-i18n="col.provider"></th><th>Model</th><th data-i18n="col.status"></th><th data-i18n="col.ops"></th></tr></thead>
        <tbody>${g.members.map(m => `<tr data-g="${esc(g.name)}" data-p="${esc(m.provider)}" data-m="${esc(m.model)}"><td class="ord" draggable="true">⠿ ${m.priority}</td><td>${esc(m.provider)}</td>

          <td style="white-space:nowrap"><button class="btn sm ghost" data-act="tgl" data-g="${esc(g.name)}" data-p="${esc(m.provider)}" data-m="${esc(m.model)}">${esc(m.disabled ? L("启用", "Enable") : L("禁用", "Disable"))}</button>
          <button class="btn sm danger" data-act="del" data-g="${esc(g.name)}" data-p="${esc(m.provider)}" data-m="${esc(m.model)}">${esc(L("删除", "Delete"))}</button></td></tr>`).join("")}</tbody></table>
      </div>`).join("")
      || `<div class="empty"><div class="big">🧭</div><b>${esc(L("还没有路由组", "No routing groups yet"))}</b>${esc(L("路由组 = 一组「服务商 + 模型」的优先级列表，故障时自动转移", "A group is a prioritized list of provider/model pairs with automatic failover"))}</div>`;

function wireMemberRows() {
  let rowDrag = null;
  document.querySelectorAll("#rt-grid tbody tr").forEach(row => {
    const ord = row.querySelector("td.ord");
    if (!ord) return;
    ord.ondragstart = (e) => { rowDrag = row; e.dataTransfer.effectAllowed = "move"; };
    ord.ondragend = () => { rowDrag = null; };
    row.ondragover = (e) => { if (!rowDrag || rowDrag.dataset.g !== row.dataset.g) return; e.preventDefault(); row.classList.add("dragover"); };
    row.ondragleave = () => row.classList.remove("dragover");
    row.ondrop = async (e) => {
      e.preventDefault(); row.classList.remove("dragover");
      const from = rowDrag; rowDrag = null;
      if (!from || from === row) return;
      const rows = [...row.parentElement.querySelectorAll("tr")];
      const fi = rows.indexOf(from), ti = rows.indexOf(row);
      rows.splice(ti, 0, rows.splice(fi, 1)[0]);
      const members = rows.map((r, i) => ({ provider: r.dataset.p, model: r.dataset.m, priority: i + 1 }));
      try {
        const j = await post("/_admin/routing", { group: row.dataset.g, members });
        toast(L("优先级顺序已保存并热重载", "Priority order saved & hot-reloaded") + agentRefreshedNote(j), "ok");
      } catch (err) { toast(err.message, "bad"); }
      loadRouting();
    };
  });
}

function agentRefreshedNote(j) {
  const n = j && j.agents_refreshed ? j.agents_refreshed.length : 0;
  return n ? L(`，已自动刷新 ${n} 个接入器配置`, ` · ${n} agent config(s) refreshed`) : "";
}
function gridOps() {
  document.querySelectorAll("#rt-grid button[data-act]").forEach(b => { b.onclick = () => memberAct(b); });
}
async function memberAct(b) {
  const g = state.groups.find(x => x.name === b.dataset.g); if (!g) return;
  let ms = g.members.map(m => ({ provider: m.provider, model: m.model, priority: m.priority, disabled: !!m.disabled }));
  const hit = (m) => m.provider === b.dataset.p && m.model === b.dataset.m;
  if (b.dataset.act === "del") {
    if (!await confirmM(L("删除成员", "Remove member"),
      L(`确定从路由组 ${b.dataset.g} 中删除 ${b.dataset.p}/${b.dataset.m}？删除后立即热重载。`,
        `Remove ${b.dataset.p}/${b.dataset.m} from group ${b.dataset.g}? Hot-reload applies immediately.`))) return;
    ms = ms.filter(m => !hit(m));
  }
  else ms.forEach(m => { if (hit(m)) m.disabled = !m.disabled; });
  if (!ms.length) return toast(L("至少保留一个成员", "Keep at least one member"), "warn");
  try {
    const j = await post("/_admin/routing", { group: g.name, members: ms });
    toast(L("已保存并热重载", "Saved & hot-reloaded") + agentRefreshedNote(j), "ok");
    loadRouting();
  } catch (err) { toast(err.message, "bad"); }
}
function quickAddMember(name) {
  if (!state.providers.length) { loadRouting(); }
  const first = state.providers[0];
  if (!first) return toast(L("请先添加服务商", "Add a provider first"), "warn");
  openModal(t("rt.quickAdd") + " · " + name, `
    <label class="f"><span>${esc(t("col.provider"))}</span><select id="qa-p">${providerOpts(first.id)}</select></label>
    <label class="f"><span>Model</span><div id="qa-mw"></div></label>`,
    `<button class="btn ghost" onclick="closeModal()">${esc(t("common.cancel"))}</button>
     <button class="btn primary" id="qa-ok">${esc(L("添加", "Add"))}</button>`);
  let qm = (first.models || [])[0] || "";
  const renderM = () => {
    const pid = $("qa-p").value;
    const ms = (state.providers.find(x => x.id === pid) || {}).models || [];
    qm = ms.includes(qm) ? qm : (ms[0] || "");
    $("qa-mw").innerHTML = ms.length
      ? `<span class="cb"><input id="qa-m" type="text" value="${esc(qm)}" placeholder="${esc(cbModelLabel())}"><span class="cb-ar">▼</span></span>`
      : `<input id="qa-m" type="text" value="${esc(qm)}" placeholder="${esc(L("输入模型名（该服务商未预置模型）", "Enter model name (no preset models)"))}">`;
    if (ms.length) {
      cbAttach($("qa-m"),
        freeSort(pid, ms).map(m => ({ value: m, label: freeOpt(pid, m) })),
        (v) => { qm = v; },
        () => qm);
    } else {
      $("qa-m").oninput = () => { qm = $("qa-m").value; };
    }
  };
  $("qa-p").onchange = renderM; renderM();
  $("qa-ok").onclick = async () => {
    const g = state.groups.find(x => x.name === name); if (!g) return;
    const model = String(qm || "").trim();
    if (!model) return toast(L("模型不能为空", "Model required"), "warn");
    const ms = g.members.map(m => ({ provider: m.provider, model: m.model, priority: m.priority, disabled: !!m.disabled }));
    if (ms.some(m => m.provider === $("qa-p").value && m.model === model)) return toast(L("该成员已存在", "Member already exists"), "warn");
    ms.push({ provider: $("qa-p").value, model, priority: Math.max(0, ...ms.map(m => m.priority || 0)) + 1 });
    try {
      const j = await post("/_admin/routing", { group: name, members: ms });
      closeModal(); toast(L("成员已添加并热重载", "Member added & hot-reloaded") + agentRefreshedNote(j), "ok");
      loadRouting();
    } catch (err) { toast(err.message, "bad"); }
  };
}

function wireGroupDrag() {
  const grid = $("rt-grid"); if (!grid) return;
  let dragEl = null;
  grid.querySelectorAll(".grip").forEach(el => {
    el.ondragstart = (e) => { dragEl = el.closest(".gcard"); e.dataTransfer.effectAllowed = "move"; };
    el.ondragend = () => { dragEl = null; };
  });
  grid.querySelectorAll(".gcard").forEach(card => {
    card.ondragover = (e) => { if (!dragEl) return; e.preventDefault(); card.classList.add("dragover"); };
    card.ondragleave = () => card.classList.remove("dragover");
    card.ondrop = async (e) => {
      e.preventDefault(); card.classList.remove("dragover");
      const from = dragEl; dragEl = null;
      if (!from || from === card) return;
      const names = [...grid.querySelectorAll(".gcard")].map(c => c.dataset.name);
      const fi = names.indexOf(from.dataset.name), ti = names.indexOf(card.dataset.name);
      if (fi < 0 || ti < 0) return;
      names.splice(ti, 0, names.splice(fi, 1)[0]);
      try {
        await post("/_admin/routing", { order: names });
        toast(L("顺序已保存并热重载", "Order saved & hot-reloaded"), "ok");
      } catch (err) { toast(err.message, "bad"); }
      loadRouting();
    };
  });
}

let gm = [];
function providerOpts(sel) {
  return state.providers.map(p => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""}>${esc(p.id)} (${esc(p.vendor)})</option>`).join("");
}

// ---------------- 可搜索下拉（服务商模型列表太长时靠输入过滤） ----------------
// 输入框只做过滤与展示，真正提交的值仍是列表里的某一项；浮层挂在 body 上
// 用 fixed 定位，避免被模态框的滚动区裁切。
const cbModelLabel = () => L("搜索或选择模型", "Search or pick a model");
let cbPop = null, cbOwner = null, cbList = [], cbHl = -1, cbOnPick = null;
function cbEnsure() {
  if (cbPop) return cbPop;
  cbPop = document.createElement("div");
  cbPop.className = "cb-pop";
  document.body.appendChild(cbPop);
  document.addEventListener("mousedown", (e) => {
    if (!cbOwner || cbPop.contains(e.target) || cbOwner.contains(e.target)) return;
    cbClose();
  }, true);
  document.addEventListener("scroll", () => cbClose(), true);
  window.addEventListener("resize", () => cbClose());
  return cbPop;
}
function cbClose() {
  if (cbPop) { cbPop.classList.remove("on"); cbPop.innerHTML = ""; }
  cbOwner = null; cbList = []; cbHl = -1; cbOnPick = null;
}
function cbMark() {
  if (!cbPop) return;
  cbPop.querySelectorAll(".cb-opt").forEach(o => o.classList.toggle("hl", +o.dataset.i === cbHl));
  const cur = cbPop.querySelector(".cb-opt.hl");
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function cbShow(el, items, q) {
  const pop = cbEnsure();
  const s = q.trim().toLowerCase();
  cbList = s ? items.filter(x => x.value.toLowerCase().includes(s) || x.label.toLowerCase().includes(s)) : items.slice();
  cbHl = cbList.findIndex(x => x.value === el.value);
  if (cbHl < 0) cbHl = cbList.length ? 0 : -1;
  const cur = el.value;
  pop.innerHTML = cbList.length
    ? cbList.map((x, i) => `<div class="cb-opt${i === cbHl ? " hl" : ""}${x.value === cur ? " sel" : ""}" data-i="${i}">${esc(x.label)}</div>`).join("")
    : `<div class="cb-empty">${esc(L("无匹配模型", "No matching models"))}</div>`;
  const r = el.getBoundingClientRect();
  pop.style.left = r.left + "px";
  pop.style.top = (r.bottom + 4) + "px";
  pop.style.width = Math.max(r.width, 220) + "px";
  pop.style.maxHeight = Math.max(80, Math.min(236, window.innerHeight - r.bottom - 12)) + "px";
  pop.classList.add("on");
  cbOwner = el;
  pop.querySelectorAll(".cb-opt").forEach(o => {
    o.onmousedown = (e) => e.preventDefault(); // 保住输入框焦点，选项才能收到 click
    o.onmouseenter = () => { cbHl = +o.dataset.i; cbMark(); };
    o.onclick = () => {
      const it = cbList[+o.dataset.i], pick = cbOnPick;
      if (it) el.value = it.value;
      cbClose();
      if (it && pick) pick(it.value);
    };
  });
  if (cbHl >= 0) cbMark();
}
function cbPick(i) {
  const it = cbList[i >= 0 ? i : 0], pick = cbOnPick;
  if (!it) return;
  cbOwner.value = it.value;
  cbClose();
  pick(it.value);
}
/** 给输入框挂可搜索下拉：items=[{value,label}]，onPick(选中的 value)，getCommitted() 取已提交值。 */
function cbAttach(el, items, onPick, getCommitted) {
  el.setAttribute("autocomplete", "off");
  el.onfocus = () => { cbOnPick = onPick; cbShow(el, items, ""); };
  el.oninput = () => { cbOnPick = onPick; cbShow(el, items, el.value); };
  el.onblur = () => {
    if (cbOwner === el) cbClose();
    el.value = getCommitted(); // 输入框不接受半截关键字，失焦回到已提交的模型名
  };
  el.onkeydown = (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (cbOwner !== el) { cbOnPick = onPick; cbShow(el, items, el.value); return; }
      if (!cbList.length) return;
      cbHl = (cbHl + (e.key === "ArrowDown" ? 1 : cbList.length - 1)) % cbList.length;
      cbMark();
    } else if (e.key === "Enter") {
      if (cbOwner === el && cbList.length) { e.preventDefault(); cbPick(cbHl); }
    } else if (e.key === "Escape") {
      if (cbOwner === el) { e.stopPropagation(); cbClose(); el.value = getCommitted(); }
    } else if (e.key === "Tab") {
      if (cbOwner === el) cbClose(); // 失焦时 onblur 会把半截关键字还原成已提交值
    }
  };
}

function renderMembers() {
  $("gm-list").innerHTML = gm.map((r, i) => {
    const p = state.providers.find(x => x.id === r.provider);
    const ms = (p && p.models) || [];
    const modelCell = ms.length
      ? `<span class="cb"><input class="mm" data-i="${i}" data-f="model" type="text" value="${esc(r.model)}" placeholder="${esc(cbModelLabel())}"><span class="cb-ar">▼</span></span>`
      : `<input class="mm" data-i="${i}" data-f="model" type="text" value="${esc(r.model)}" placeholder="${esc(L("输入模型名（该服务商未预置模型）", "Enter model name (no preset models)"))}">`;
    return `<div class="mrow" data-i="${i}"><span class="grip" draggable="true" title="${esc(L("拖动排序", "Drag to reorder"))}">⠿</span>
      <span class="chip">#${i + 1}</span>
      <select class="mp" data-i="${i}" data-f="provider">${providerOpts(r.provider)}</select>
      ${modelCell}
      <button class="btn sm danger" data-act="rm" data-i="${i}">✕</button></div>`;
  }).join("");
  $("gm-list").querySelectorAll("select,input").forEach(el => {
    if (el.closest(".cb")) return; // 可搜索下拉单独绑定（输入只用于过滤，不直接提交）
    el.onchange = () => {
      const row = gm[+el.dataset.i];
      row[el.dataset.f] = el.value;
      if (el.dataset.f === "provider") {
        const ms = (state.providers.find(x => x.id === el.value) || {}).models || [];
        row.model = ms.includes(row.model) ? row.model : (ms[0] || "");
        renderMembers();
      }
    };
    if (el.tagName === "INPUT") el.oninput = el.onchange;
  });
  $("gm-list").querySelectorAll(".cb input").forEach(el => {
    const i = +el.dataset.i;
    const pid = gm[i].provider;
    const ms = (state.providers.find(x => x.id === pid) || {}).models || [];
    cbAttach(el,
      freeSort(pid, ms).map(m => ({ value: m, label: freeOpt(pid, m) })),
      (v) => { gm[i].model = v; },
      () => gm[i].model);
  });
  let dragI = null;
  $("gm-list").querySelectorAll(".grip").forEach(el => {
    el.ondragstart = (e) => { dragI = +el.closest(".mrow").dataset.i; e.dataTransfer.effectAllowed = "move"; };
    el.ondragend = () => { dragI = null; };
  });
  $("gm-list").querySelectorAll(".mrow").forEach(row => {
    row.ondragover = (e) => { if (dragI == null) return; e.preventDefault(); row.classList.add("dragover"); };
    row.ondragleave = () => row.classList.remove("dragover");
    row.ondrop = (e) => {
      e.preventDefault(); row.classList.remove("dragover");
      const from = dragI, to = +row.dataset.i;
      if (from != null && from !== to) { const [m] = gm.splice(from, 1); gm.splice(to, 0, m); }
      dragI = null; renderMembers();
    };
  });
  $("gm-list").querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.i;
      if (b.dataset.act === "rm") gm.splice(i, 1);
      renderMembers();
    };
  });
}
async function openGroup(name) {
  if (!state.providers.length) {
    try { state.providers = await api("/api/providers"); } catch (err) { return toast(err.message, "bad"); }
  }
  if (!state.providers.length) return toast(L("请先添加服务商", "Add a provider first"), "warn");
  const g = name ? state.groups.find(x => x.name === name) : null;
  gm = g ? g.members.map(m => ({ provider: m.provider, model: m.model }))
         : [{ provider: state.providers[0].id, model: (state.providers[0].models || [])[0] || "" }];
  openModal(name ? L("编辑路由组", "Edit group") + " · " + name : t("rt.add"), `
    <label class="f"><span>${esc(L("组名", "Group name"))}</span>
      <input id="gm-name" type="text" value="${esc(name || "")}" ${name ? "disabled" : ""} placeholder="${esc(L("如 default / fast / strong", "e.g. default / fast / strong"))}"></label>
    ${name ? "" : `<div class="muted" style="margin-top:-6px;margin-bottom:10px">${esc(L("Agent 通过路径识别组：/opencode/v1/chat/completions 走各自默认组；组名可在「接入器」里绑定", "Agents route via their default group; bind a group per agent in the Agents view"))}</div>`}
    <span class="muted">${esc(L("成员（按顺序尝试，失败自动转移）", "Members (tried in order, failover on error)"))}</span>

// ---------------- agents（双栏：左按环境分组的实例列表 / 右详情与路由配置） ----------------
const AG_ATTACHABLE = ["opencode", "codex", "hermes", "generic"];
async function loadAgents() {
  try {
    state.agents = await api("/api/agents");
    state.groups = (await api("/api/routing")).groups || [];
    // 后端按运行环境分组返回 {scopes:[{id,kind,label,distro,home,note,agents:[...]}], agents:[扁平列表]}：
    // 本机的 hermes 与 WSL 里的 hermes@wsl:Ubuntu 是两个独立实例，各自带接入状态。
    const resp = await api("/api/agents/detect");
    state.scopes = resp.scopes || [];
    state.instances = resp.agents || [];
    drawAgents();
    return true;
  } catch (err) { toast(err.message, "bad"); return false; }
}
function agSel() {
  if (!state.selAgent) return null;
  const d = (state.instances || []).find(x => x.agent_id === state.selAgent);
  if (d) return { orphan: false, it: d, sc: (state.scopes || []).find(s => s.id === d.scope_id) || null };
  const a = (state.agents || []).find(x => x.agent_id === state.selAgent);
  if (a) return { orphan: true, it: a, sc: null };
  return null;
}
function selAgent(id) { state.selAgent = id; drawAgents(); }
function agStatus(x) {
  if (!AG_ATTACHABLE.includes(x.adapter)) return ["dim", L("不支持", "unsupported")];
  if (x.other_gateway) return ["warn", L("被他网关占用", "other gateway")];
  if (x.drifted) return ["warn", L("漂移", "drifted")];
  if (x.attached) return ["on", L("已接入", "attached")];
  return ["dim", L("未接入", "detached")];
}
function agModelsCell(gname) {
  const g = state.groups.find(x => x.name === gname);
  if (!g || !g.members.length) return `<span class="muted">-</span>`;
  const ms = g.members.filter(m => !m.disabled);
  if (!ms.length) return `<span class="muted">${esc(L("成员已全部停用", "all members disabled"))}</span>`;
  // 按优先级从上到下排，序号就是请求时的尝试次序
  return `<div class="ag-mlist">` + ms.map((m, i) =>
    `<div class="ag-mrow"><span class="ag-mord">${i + 1}</span><code>${esc(m.provider)}/${esc(m.model)}</code>${isFreeM(m.provider, m.model) ? freeTag() : ""}</div>`).join("") + `</div>`;
}
function drawAgents() {
  const segs = [];
  for (const sc of (state.scopes || [])) {
    const items = sc.agents || [];
    if (!items.length) continue; // 后端已过滤空环境，这里双保险
    segs.push({ key: sc.label, note: sc.note, items, orphan: false });
  }
  // 配置里有、但当前环境扫描不到的条目（自定义 generic Agent、环境不可达等）单独成段
  const orphans = (state.agents || []).filter(a => !(state.instances || []).some(d => d.agent_id === a.agent_id));
  if (orphans.length) segs.push({ key: L("已配置 · 未检测到", "Configured · not found"), note: "", items: orphans, orphan: true });
  if (!segs.some(s => s.items.some(it => it.agent_id === state.selAgent)))
    state.selAgent = segs.length ? segs[0].items[0].agent_id : null;
  // 显示名只在扁平列表（resp.agents）里附带，嵌套 scopes[].agents 需回查
  const flat = {};
  for (const d of (state.instances || [])) flat[d.agent_id] = d;
  $("ag-inst-list").innerHTML = segs.map(s =>
    `<div class="ag-seg">${esc(s.key)}</div>` + (s.note ? `<div class="muted" style="padding:0 8px 6px">${esc(s.note)}</div>` : "") +
    s.items.map(it => {
      const [stp, stx] = agStatus(it);
      const name = it.display_name || (flat[it.agent_id] || {}).display_name || (s.orphan ? it.agent_id : it.kind) || it.agent_id;

        <div style="flex:1;min-width:0"><span class="nm">${esc(name)}</span>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>
        <span class="pill ${stp}"><i></i>${esc(stx)}</span></div>`;
    }).join("")).join("")
    || `<div class="empty" style="margin:10px"><div class="big">🤖</div><b>${esc(L("未检测到已安装的 Agent", "No installed agents detected"))}</b>${esc(L("可用右上角「＋ 新增 Agent」添加自定义（generic）Agent", "Use ＋ New Agent (top right) to add a custom generic agent"))}</div>`;

    ${cross ? `<div class="ag-warn">⚠ ${esc(L(
      `跨环境实例：该工具安装在「${envLabel}」，网关运行于本机环境。注入的 base_url 为网关监听地址（默认 127.0.0.1）；跨环境访问需启用 WSL 镜像网络模式，或在「设置」页将监听地址改为 0.0.0.0 并放行防火墙，否则该 Agent 无法连上网关。`,
      `Cross-environment instance: this tool lives in "${envLabel}" while the gateway runs natively. The injected base_url is the gateway listen address (127.0.0.1 by default); reaching it across environments requires WSL mirrored networking mode, or set the listen address to 0.0.0.0 in Settings and open the firewall — otherwise this agent cannot connect to the gateway.`))}</div>` : ""}`;

  if (!attachable) {

<script>

async function loadAutostart() {

    toast(on ? L("已开启开机自启，下次登录生效", "Autostart enabled — effective at next login") : L("已关闭开机自启", "Autostart disabled"), "ok");

function download(name, data, isText) {
  let blob;
  if (isText) blob = new Blob([data], { type: "text/plain" });
  else {
    const bin = atob(data.trim());
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    blob = new Blob([u]);
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
async function exportBackup() {
  const pw = $("bk-exp-pw").value;
  if (!pw) return toast(L("请先设置备份密码", "Choose a backup password first"), "warn");

    const r = await post("/_admin/export-enc", { password: pw });
    download(r.filename, r.data_b64, false);
    $("bk-exp-pw").value = "";
    toast(L("备份已导出（含全部 Key，已加密）：", "Encrypted backup exported (includes all keys): ") + r.filename, "ok");
  } catch (err) { toast(err.message, "bad"); }
}
$("bk-imp-file").onchange = () => {
  const f = $("bk-imp-file").files[0];

};
async function importBackup() {
  const f = $("bk-imp-file").files[0];
  const pw = $("bk-imp-pw").value;
  if (!f) return toast(L("请先选择 .aback 备份文件", "Pick a .aback backup file first"), "warn");
  if (!pw) return toast(L("请输入备份密码", "Enter the backup password"), "warn");
  const buf = new Uint8Array(await f.arrayBuffer());
  let bin = "";
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  const data = btoa(bin);
  if (!await confirmM(t("st.importB"),
    L(`导入将整份替换当前 config.yaml（自动 .bak 备份）并合并 ${f.name} 中的 env 键，随后热重载。确定？`,
      `Import replaces config.yaml (auto .bak) and merges the env keys from ${f.name}, then hot-reloads. Proceed?`))) return;
  try {
    const r = await post("/_admin/import-enc", { password: pw, data_b64: data });
    $("bk-imp-pw").value = ""; $("bk-imp-file").value = ""; state.bkFile = null; $("bk-imp-name").textContent = t("st.noFile");
    (r.warnings || []).forEach(w => toast(w, "warn"));
    toast(L("导入成功，已合并 ", "Imported, merged ") + (r.env_keys ?? 0) + L(" 个 env 键并热重载", " env keys, hot-reloaded"), "ok");
    if (r.addr_changed) toast(L("监听地址有变化，需重启进程生效。", "Listen addresses changed — restart the process to apply."), "warn");
    loadSettings();
  } catch (err) { toast(err.message, "bad"); }
}
async function loadConfig() {
  try {
    const j = await api("/api/config");
    $("cfg-text").value = j.text; $("cfg-path").textContent = j.path;
  } catch (err) { toast(err.message, "bad"); }
}
async function saveConfig() {
  try {
    const r = await post("/_admin/config", { text: $("cfg-text").value });
    (r.warnings || []).forEach(w => toast(w, "warn"));
    toast(L("配置已校验、保存并热重载", "Config validated, saved & hot-reloaded"), "ok");
    loadSettings();
  } catch (err) { toast(err.message, "bad"); }
}
function exportYaml() {
  if (!$("cfg-text").value) return toast(L("请先读取配置", "Load the config first"), "warn");
  download("agentbuffet-config.yaml", $("cfg-text").value, true);
}
async function copyConfig() {
  try { await navigator.clipboard.writeText($("cfg-text").value); toast(t("st.copied"), "ok"); }
  catch (e) { toast(L("复制失败，请手动选择", "Copy failed, select manually"), "bad"); }
}

// ---------------- init ----------------
(async function init() {
  try { state.gw = (await api("/api/config")).gateway; } catch (e) { /* loopback only */ }
  applyLang();
  const v0 = location.hash.slice(1);
  if (LOADERS[v0] && v0 !== curView) switchView(v0); else startMap();
})();
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  if (LOADERS[v] && v !== curView) switchView(v);
});
</script>
</body>
