<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentBuffet</title>
<style>
:root {
  --bg: #10141a; --panel: #171d26; --line: #263041; --text: #d7dee8;
  --dim: #8a97a8; --accent: #4da3ff; --ok: #3fb96f; --warn: #e0a63c; --bad: #e05c5c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "SF Mono", "Cascadia Code", Consolas, "Noto Sans Mono CJK SC", monospace; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; color: var(--accent); }
header .sub { color: var(--dim); font-size: 12px; }
nav { display: flex; gap: 6px; margin-left: auto; }
nav button { background: none; border: 1px solid var(--line); color: var(--dim);
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.on { color: var(--text); border-color: var(--accent); background: #1b2a3d; }
main { padding: 18px 20px 40px; max-width: 1200px; margin: 0 auto; }
.view { display: none; } .view.on { display: block; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
button.act { background: #1b2a3d; border: 1px solid var(--line); color: var(--accent);
  padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
button.act:hover { border-color: var(--accent); }
button.act.danger { color: var(--bad); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card .k { color: var(--dim); font-size: 12px; }
.card .v { font-size: 20px; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
th { color: var(--dim); font-weight: normal; background: #131923; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid; }
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.warn { color: var(--warn); border-color: var(--warn); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
.badge.dim { color: var(--dim); border-color: var(--line); }
.bar { background: #0c1015; border-radius: 4px; height: 8px; width: 120px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
pre { background: #0c1015; border: 1px solid var(--line); border-radius: 6px;
  padding: 10px; overflow-x: auto; font-size: 12px; color: #b8c4d4; }
.muted { color: var(--dim); font-size: 12px; }
.group { margin-bottom: 18px; }
.group h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
.msg { margin-top: 10px; white-space: pre-wrap; }
select, input[type=password], input[type=text] { background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
input#qa-key { width: 280px; }
select:disabled { opacity: .45; }
</style>
</head>
<body>
<header>
  <h1>AgentBuffet</h1><span class="sub" data-i18n="sub"></span>
  <nav>
    <button data-v="overview" class="on" data-i18n="nav.overview"></button>
    <button data-v="providers" data-i18n="nav.providers"></button>
    <button data-v="routing" data-i18n="nav.routing"></button>
    <button data-v="agents" data-i18n="nav.agents"></button>
    <button data-v="config" data-i18n="nav.config"></button>
    <button id="lang-btn" onclick="toggleLang()">中</button>
  </nav>
</header>
<main>
  <section id="v-overview" class="view on">
    <div class="toolbar"><button class="act" onclick="loadOverview()" data-i18n="refresh"></button>
      <span class="muted" id="ov-date"></span></div>
    <div class="cards">
      <div class="card"><div class="k" data-i18n="ov.req"></div><div class="v" id="ov-req">-</div></div>
      <div class="card"><div class="k">Prompt tokens</div><div class="v" id="ov-pt">-</div></div>
      <div class="card"><div class="k">Completion tokens</div><div class="v" id="ov-ct">-</div></div>
      <div class="card"><div class="k" data-i18n="ov.cost"></div><div class="v" id="ov-cost">-</div></div>
    </div>
    <h3 class="muted" data-i18n="ov.recent"></h3>
    <table><thead><tr><th data-i18n="col.time"></th><th>Agent</th><th data-i18n="col.group"></th><th>Provider</th><th>Model</th>
      <th data-i18n="col.status"></th><th>Token</th><th data-i18n="col.cost"></th><th data-i18n="col.dur"></th><th data-i18n="col.chain"></th></tr></thead>
      <tbody id="ov-recent"></tbody></table>
  </section>

  <section id="v-providers" class="view">
    <div class="toolbar"><button class="act" onclick="loadProviders()" data-i18n="refresh"></button>
      <span class="muted" data-i18n="pv.hint"></span></div>
    <table><thead><tr><th>Provider</th><th>Vendor</th><th data-i18n="col.status"></th><th data-i18n="pv.quota"></th>
      <th data-i18n="pv.lastfail"></th><th data-i18n="col.ops"></th></tr></thead><tbody id="pv-rows"></tbody></table>
    <div class="msg muted" id="pv-msg"></div>
  </section>

  <section id="v-routing" class="view">
    <div class="toolbar"><button class="act" onclick="loadRouting()" data-i18n="refresh"></button>
      <span class="muted" data-i18n="rt.hint"></span></div>
    <div id="rt-rows"></div>
    <div class="msg muted" id="rt-msg"></div>
  </section>

  <section id="v-agents" class="view">
    <div class="toolbar"><button class="act" onclick="loadAgents()" data-i18n="refresh"></button>
      <span class="muted" data-i18n="ag.hint"></span></div>
    <table><thead><tr><th>Agent</th><th data-i18n="ag.adapter"></th><th data-i18n="col.status"></th><th data-i18n="ag.defgroup"></th>
      <th data-i18n="col.ops"></th></tr></thead><tbody id="ag-rows"></tbody></table>
    <div class="msg" id="ag-msg"></div>
    <pre id="ag-diff" style="display:none"></pre>
  </section>

  <section id="v-config" class="view">
    <div class="group">
      <h3 data-i18n="qa.title"></h3>
      <div class="toolbar">
        <select id="qa-vendor" onchange="populatePlans()"></select>
        <select id="qa-plan"></select>
        <input id="qa-key" type="password" autocomplete="off" data-i18n-ph="qa.keyph">
        <button class="act" onclick="addProvider()" data-i18n="qa.add"></button>
      </div>
      <div class="muted" data-i18n="qa.hint"></div>
      <div class="msg muted" id="qa-msg"></div>
    </div>
    <div class="toolbar">
      <button class="act" onclick="loadConfig()" data-i18n="cfg.load"></button>
      <button class="act" onclick="saveConfig()" data-i18n="cfg.save"></button>
      <button class="act" onclick="exportConfig()" data-i18n="cfg.export"></button>
      <button class="act" onclick="copyConfig()" data-i18n="cfg.copy"></button>
      <span class="muted" data-i18n="cfg.hint"></span></div>
    <div class="msg muted" id="cfg-msg"></div>
    <textarea id="cfg-text" spellcheck="false" style="width:100%;height:60vh;background:var(--panel);
      color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;
      font:13px/1.5 ui-monospace,monospace;resize:vertical"></textarea>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const fmt = (n) => (n ?? 0).toLocaleString();
const tstr = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString() : "-";

// ---------------- i18n ----------------
const I18N = {
  zh: {
    sub: "本地网关", refresh: "刷新",
    "nav.overview": "概览", "nav.providers": "服务商", "nav.routing": "路由",
    "nav.agents": "接入器", "nav.config": "配置",
    "ov.req": "今日请求", "ov.cost": "费用估算", "ov.recent": "最近 20 条",
    "col.time": "时间", "col.group": "组", "col.status": "状态", "col.cost": "费用",
    "col.dur": "耗时", "col.chain": "失败链", "col.ops": "操作",
    "ov.none": "暂无记录", "ov.date": "日期",
    "pv.hint": "额度 = 当日软上限（保守系数×收紧系数）", "pv.quota": "当日 tokens / 软上限",
    "pv.lastfail": "最近失败", "pv.none": "无 provider", "pv.nquota": "未设额度",
    "pv.test": "测试", "pv.enable": "启用", "pv.disable": "停用",
    "rt.hint": "↑↓ 调整优先级即时写回 config.yaml 并热重载",
    "rt.prio": "优先级", "rt.model": "Model", "rt.tune": "调整", "rt.none": "无路由组",
    "ag.hint": "attach 只写占位 Key；detach 从备份逐字节还原",
    "ag.adapter": "适配器", "ag.defgroup": "默认组", "ag.attached": "已接入",
    "ag.drifted": "漂移", "ag.off": "未接入", "ag.none": "配置中无 agent",
    "ag.preview": "预览", "ag.attach": "接入", "ag.detach": "还原",
    "qa.title": "快速添加服务商", "qa.keyph": "粘贴 API Key",
    "qa.add": "添加", "qa.pickv": "选择厂商", "qa.pickp": "选择套餐",
    "qa.hint": "选择厂商与套餐、粘贴 Key 即可；Key 只写入本机 env 文件（600），不进配置。",
    "cfg.load": "读取当前配置", "cfg.save": "保存并应用", "cfg.export": "导出下载",
    "cfg.copy": "复制全文",
    "cfg.hint": "保存即校验（失败不落盘），成功后自动热重载；API Key 只存在于网关环境变量，不在配置中",
  },
  en: {
    sub: "Local gateway", refresh: "Refresh",
    "nav.overview": "Overview", "nav.providers": "Providers", "nav.routing": "Routing",
    "nav.agents": "Agents", "nav.config": "Config",
    "ov.req": "Requests today", "ov.cost": "Est. cost", "ov.recent": "Last 20 requests",
    "col.time": "Time", "col.group": "Group", "col.status": "Status", "col.cost": "Cost",
    "col.dur": "Duration", "col.chain": "Fail chain", "col.ops": "Actions",
    "ov.none": "No records", "ov.date": "Date",
    "pv.hint": "Quota = daily soft cap (conservative × tightened)", "pv.quota": "Tokens today / soft cap",
    "pv.lastfail": "Last failure", "pv.none": "No providers", "pv.nquota": "no quota",
    "pv.test": "Test", "pv.enable": "Enable", "pv.disable": "Disable",
    "rt.hint": "↑↓ reorder writes back to config.yaml with hot reload",
    "rt.prio": "Priority", "rt.model": "Model", "rt.tune": "Tune", "rt.none": "No routing groups",
    "ag.hint": "attach writes placeholder keys; detach restores from backup byte-for-byte",
    "ag.adapter": "Adapter", "ag.defgroup": "Default group", "ag.attached": "Attached",
    "ag.drifted": "Drifted", "ag.off": "Detached", "ag.none": "No agents in config",
    "ag.preview": "Preview", "ag.attach": "Attach", "ag.detach": "Restore",
    "qa.title": "Quick add provider", "qa.keyph": "Paste API key",
    "qa.add": "Add", "qa.pickv": "Pick vendor", "qa.pickp": "Pick plan",
    "qa.hint": "Pick a vendor and plan, paste the key. The key is stored only in the local env file (600), never in config.",
    "cfg.load": "Load current config", "cfg.save": "Save & apply", "cfg.export": "Export",
    "cfg.copy": "Copy all",
    "cfg.hint": "Save validates first (nothing is written on failure) and hot-reloads on success; API keys live only in gateway env vars, not in config",
  },
};
let lang = localStorage.getItem("buffet-lang")
  || (navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");
const t = (k) => I18N[lang][k] ?? I18N.zh[k] ?? k;
const L = (zh, en) => lang === "zh" ? zh : en;

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $("lang-btn").textContent = lang === "zh" ? "EN" : "中";
  populateCatalog();
}
function toggleLang() {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("buffet-lang", lang);
  applyLang();
  LOADERS[curView]();
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || (j.details ? j.details.join("; ") : "HTTP " + r.status));
  return j;
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
});

let curView = "overview";
const LOADERS = { overview: loadOverview, providers: loadProviders,
  routing: loadRouting, agents: loadAgents, config: loadConfigView };
document.querySelectorAll("nav button[data-v]").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button[data-v]").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  $("v-" + b.dataset.v).classList.add("on");
  curView = b.dataset.v;
  LOADERS[b.dataset.v]();
});

// ---------------- Overview ----------------
async function loadOverview() {
  try {
    const j = await api("/api/overview");
    $("ov-date").textContent = t("ov.date") + " " + j.date;
    $("ov-req").textContent = fmt(j.totals.requests);
    $("ov-pt").textContent = fmt(j.totals.prompt_tokens);
    $("ov-ct").textContent = fmt(j.totals.completion_tokens);
    $("ov-cost").textContent = (j.totals.cost_est ?? 0).toFixed(4);
    $("ov-recent").innerHTML = (j.recent || []).map(e => `<tr>
      <td>${tstr(e.ts)}</td><td>${esc(e.agent)}</td><td>${esc(e.group)}</td>
      <td>${esc(e.provider)}</td><td>${esc(e.model)}</td>
      <td><span class="badge ${e.status < 400 ? "ok" : "bad"}">${e.status}</span></td>
      <td>${fmt(e.prompt_tokens)}/${fmt(e.completion_tokens)}</td>
      <td>${e.cost_est == null ? "-" : e.cost_est.toFixed(4)}</td>
      <td>${e.duration_ms}ms</td><td class="muted">${esc((e.fail_chain || []).join(" → "))}</td>
    </tr>`).join("") || `<tr><td colspan="10" class="muted">${t("ov.none")}</td></tr>`;
  } catch (err) { $("ov-recent").innerHTML = `<tr><td colspan="10">${esc(err.message)}</td></tr>`; }
}

// ---------------- Providers ----------------
const stBadge = (s) => ({ ok: "ok", disabled: "dim", degraded: "bad",
  circuit_open: "warn", quota_exhausted: "warn" })[s] || "dim";

async function loadProviders() {
  $("pv-msg").textContent = "";
  try {
    const rows = await api("/api/providers");
    $("pv-rows").innerHTML = rows.map(p => {
      const cap = p.effective_cap ?? p.quota_daily;
      const pct = cap ? Math.min(100, Math.round((p.tokens_used / cap) * 100)) : 0;
      const quota = cap ? `<div class="bar"><i style="width:${pct}%"></i></div>
        <span class="muted">${fmt(p.tokens_used)} / ${fmt(cap)}（${pct}%）</span>`
        : `<span class="muted">${fmt(p.tokens_used)}（${t("pv.nquota")}）</span>`;
      const fail = p.last_fail_reason ? `${esc(p.last_fail_reason)} · ${tstr(p.last_fail_ts)}` : "-";
      const dis = p.status === "disabled";
      return `<tr><td>${esc(p.id)}</td><td>${esc(p.vendor)}</td>
        <td><span class="badge ${stBadge(p.status)}">${esc(p.status)}</span></td>
        <td>${quota}</td><td class="muted">${fail}</td>
        <td><button class="act" onclick="testPv('${esc(p.id)}')">${t("pv.test")}</button>
        <button class="act ${dis ? "" : "danger"}" onclick="togglePv('${esc(p.id)}',${dis})">${dis ? t("pv.enable") : t("pv.disable")}</button></td></tr>`;
    }).join("") || `<tr><td colspan="6" class="muted">${t("pv.none")}</td></tr>`;
  } catch (err) { $("pv-msg").textContent = err.message; }
}
async function testPv(id) {
  $("pv-msg").textContent = L("测试 ", "Testing ") + id + " …";
  try {
    const r = await post("/_admin/routing/test", { provider: id });
    $("pv-msg").textContent = `${id}: ${r.ok ? "OK" : L("失败", "failed")} status=${r.status ?? "-"} ${L("耗时", "latency")}=${r.latency_ms ?? "-"}ms ${r.error ?? ""}`;
  } catch (err) { $("pv-msg").textContent = err.message; }
}
async function togglePv(id, nowDisabled) {
  try { await post("/_admin/routing", { provider: id, disabled: !nowDisabled }); loadProviders(); }
  catch (err) { $("pv-msg").textContent = err.message; }
}

// ---------------- Routing ----------------
let rtGroups = [];
async function loadRouting() {
  $("rt-msg").textContent = "";
  try {
    rtGroups = (await api("/api/routing")).groups || [];
    $("rt-rows").innerHTML = rtGroups.map((g, gi) => `<div class="group"><h3>${esc(g.name)}
      <span class="muted">（${esc(g.strategy)}）</span></h3><table><thead>
      <tr><th>${t("rt.prio")}</th><th>Provider</th><th>${t("rt.model")}</th><th>${t("col.status")}</th><th>${t("rt.tune")}</th></tr></thead><tbody>`
      + g.members.map((m, mi) => `<tr><td>${m.priority}</td><td>${esc(m.provider)}</td>
        <td>${esc(m.model)}</td>
        <td><span class="badge ${m.disabled ? "dim" : "ok"}">${m.disabled ? t("pv.disable") : t("pv.enable")}</span></td>
        <td><button class="act" onclick="move(${gi},${mi},-1)">↑</button>
        <button class="act" onclick="move(${gi},${mi},1)">↓</button>
        <button class="act ${m.disabled ? "" : "danger"}" onclick="dis(${gi},'${esc(m.provider)}',${m.disabled})">${m.disabled ? t("pv.enable") : t("pv.disable")}</button>
        </td></tr>`).join("") + "</tbody></table></div>").join("")
      || `<span class="muted">${t("rt.none")}</span>`;
  } catch (err) { $("rt-msg").textContent = err.message; }
}
async function move(gi, mi, dir) {
  const g = rtGroups[gi];
  const j = mi + dir;
  if (j < 0 || j >= g.members.length) return;
  const ms = g.members.map(m => ({ provider: m.provider, model: m.model, priority: m.priority }));
  [ms[mi].priority, ms[j].priority] = [ms[j].priority, ms[mi].priority];
  try { await post("/_admin/routing", { group: g.name, members: ms }); loadRouting(); }
  catch (err) { $("rt-msg").textContent = err.message; }
}
async function dis(gi, provider, nowDisabled) {
  try { await post("/_admin/routing", { provider, disabled: !nowDisabled }); loadRouting(); }
  catch (err) { $("rt-msg").textContent = err.message; }
}

// ---------------- Agents ----------------
async function loadAgents() {
  $("ag-msg").textContent = "";
  try {
    const rows = await api("/api/agents");
    $("ag-rows").innerHTML = rows.map(a => {
      const badge = a.attached
        ? (a.drifted ? `<span class="badge warn">${t("ag.drifted")}</span>` : `<span class="badge ok">${t("ag.attached")}</span>`)
        : `<span class="badge dim">${t("ag.off")}</span>`;
      return `<tr><td>${esc(a.agent_id)}</td><td>${esc(a.adapter)}</td>
        <td>${badge} <span class="muted">${esc(a.note || "")}</span></td>
        <td class="muted">${esc(a.config_path || "-")}</td>
        <td><button class="act" onclick="opA('${esc(a.agent_id)}',true)">${t("ag.preview")}</button>
        <button class="act" onclick="opA('${esc(a.agent_id)}',false)">${t("ag.attach")}</button>
        <button class="act danger" onclick="deA('${esc(a.agent_id)}')">${t("ag.detach")}</button></td></tr>`;
    }).join("") || `<tr><td colspan="5" class="muted">${t("ag.none")}</td></tr>`;
  } catch (err) { $("ag-msg").textContent = err.message; }
}
async function opA(id, dry) {
  $("ag-msg").textContent = (dry ? t("ag.preview") : t("ag.attach")) + " " + id + " …";
  try {
    const r = await post("/api/agents/attach", { agent_id: id, dry_run: dry });
    $("ag-msg").textContent = r.note || L("完成", "done");
    const d = (r.files || []).map(f => `--- ${f.path}\n${f.preview}`).join("\n");
    $("ag-diff").style.display = d ? "block" : "none";
    $("ag-diff").textContent = d || (r.env_template || "");
    if (!dry) loadAgents();
  } catch (err) { $("ag-msg").textContent = err.message; }
}
async function deA(id) {
  $("ag-msg").textContent = t("ag.detach") + " " + id + " …";
  try {
    const r = await post("/api/agents/detach", { agent_id: id });
    $("ag-msg").textContent = r.note || L("完成", "done");
    loadAgents();
  } catch (err) { $("ag-msg").textContent = err.message; }
}

// ---------------- Config ----------------
let cfgPath = "";
let catalogCache = null;

function loadConfigView() {
  populateCatalog();
  if (!$("cfg-text").value) loadConfig();
}

async function ensureCatalog() {
  if (catalogCache) return catalogCache;
  try { catalogCache = await api("/api/vendor-catalog"); }
  catch { catalogCache = []; }
  return catalogCache;
}

async function populateCatalog() {
  const cat = await ensureCatalog();
  const vs = $("qa-vendor");
  const keepV = vs.value;
  vs.innerHTML = `<option value="">${t("qa.pickv")}</option>` + cat.map(v =>
    `<option value="${esc(v.id)}">${esc(lang === "zh" ? v.name_zh : v.name_en)}</option>`).join("");
  if (keepV && cat.some(v => v.id === keepV)) vs.value = keepV;
  await populatePlans();
}
async function populatePlans() {
  const cat = await ensureCatalog();
  const vs = $("qa-vendor"), ps = $("qa-plan");
  const keepP = ps.value;
  const vendor = cat.find(v => v.id === vs.value);
  if (!vendor) { ps.innerHTML = `<option value="">${t("qa.pickp")}</option>`; ps.disabled = true; return; }
  ps.disabled = false;
  if (vendor.plans.length === 1) {
    const p = vendor.plans[0];
    ps.innerHTML = `<option value="${esc(p.id)}" selected>${esc(lang === "zh" ? p.label_zh : p.label_en)}</option>`;
  } else {
    ps.innerHTML = `<option value="">${t("qa.pickp")}</option>` + vendor.plans.map(p =>
      `<option value="${esc(p.id)}">${esc(lang === "zh" ? p.label_zh : p.label_en)}</option>`).join("");
    if (vendor.plans.some(p => p.id === keepP)) ps.value = keepP;
  }
}

async function addProvider() {
  const vendor = $("qa-vendor").value, plan = $("qa-plan").value;
  const key = $("qa-key").value.trim();
  if (!vendor) { $("qa-msg").textContent = L("请选择厂商", "Pick a vendor first"); return; }
  if (!plan) { $("qa-msg").textContent = L("请选择套餐", "Pick a plan"); return; }
  if (!key) { $("qa-msg").textContent = L("请输入 API Key", "Paste an API key first"); return; }
  $("qa-msg").textContent = L("添加中 …", "Adding …");
  try {
    const r = await post("/_admin/provider", { vendor, plan, api_key: key });
    $("qa-msg").textContent = L(`已添加 provider ${r.provider}（${r.models ?? 0} 个模型），Key 已写入 env（${r.api_key_env}）并热重载生效`,
      `Provider ${r.provider} added (${r.models ?? 0} models); key saved to env (${r.api_key_env}) and hot-reloaded`)
      + (r.warnings && r.warnings.length ? L("；", "; ") + r.warnings.join("；") : "");
    $("qa-key").value = "";
    loadConfig();
  } catch (err) { $("qa-msg").textContent = L("失败：", "Failed: ") + err.message; }
}

async function loadConfig() {
  $("cfg-msg").textContent = L("读取中 …", "Loading …");
  try {
    const j = await api("/api/config");
    cfgPath = j.path;
    $("cfg-text").value = j.text;
    $("cfg-msg").textContent = L("当前配置：", "Current config: ") + j.path;
  } catch (err) { $("cfg-msg").textContent = err.message; }
}
async function saveConfig() {
  const text = $("cfg-text").value;
  if (!text.trim()) { $("cfg-msg").textContent = L("配置为空，已忽略", "Config is empty, ignored"); return; }
  $("cfg-msg").textContent = L("校验并应用中 …", "Validating & applying …");
  try {
    const r = await post("/_admin/config", { text });
    $("cfg-msg").textContent = L("已保存并热重载生效", "Saved and hot-reloaded")
      + (r.addr_changed ? L("（注意：监听地址变更需重启进程）", " (note: listening address changed, restart required)") : "")
      + (r.warnings && r.warnings.length ? L("；警告：", "; warnings: ") + r.warnings.join("；") : "");
  } catch (err) { $("cfg-msg").textContent = L("失败：", "Failed: ") + err.message; }
}
function exportConfig() {
  const text = $("cfg-text").value;
  if (!text.trim()) { $("cfg-msg").textContent = L("先读取或粘贴配置再导出", "Load or paste a config before exporting"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/x-yaml" }));
  a.download = "agentbuffet-config.yaml";
  a.click();
  URL.revokeObjectURL(a.href);
  $("cfg-msg").textContent = L("已导出 agentbuffet-config.yaml", "Exported agentbuffet-config.yaml");
}
async function copyConfig() {
  try { await navigator.clipboard.writeText($("cfg-text").value); $("cfg-msg").textContent = L("已复制到剪贴板", "Copied to clipboard"); }
  catch { $("cfg-msg").textContent = L("复制失败，请手动全选复制", "Copy failed, select all manually"); }
}

applyLang();
loadOverview();
</script>
</body>
</html>
